# Cross-platform proof: the panel must COMPILE and BOOT on every OS a
# self-hoster might own. All three legs now run the same bar — build, then
# boot the real server against an empty layout and serve /api/health (the
# shape of a first-run install). The client/join gates pick their display
# mode at runtime: xvfb on headless Linux, a small visible window on
# desktop OSes, an honest skip where no display exists.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - run: npm run build -w web
      # smoke 1: the built server must load its entrypoint cleanly
      - run: node -e "import('./server/dist/config.js').then(m => { if (!m.PATHS) throw new Error('config failed'); console.log('config loads on', process.platform); })"
      # smoke 2: boot the real panel on an empty layout and hit /api/health
      - run: node .github/smoke-boot.mjs
      # smoke 3: the whole first-run story — wizard active on an empty layout,
      # Crafty admin login mints + persists the token (stub Crafty), wizard
      # turns itself off, PIN step returns a cookie that validates
      - run: node .github/wizard-e2e.mjs
      # The spawnpoint CLI against a stub panel: exit codes, plain output,
      # --yes and exact-revision approval before any write, tokens, MCP.
      - run: node .github/cli-test.mjs
      # Exercise the packaged systemd/launchd/SCM owner, real stdin, bounded
      # console output, panel reconnection, autostart and crash-loop budget.
      - run: node .github/native-runtime.mjs --service
      # The same shipped gate must hash exact UTF-8 bytes and fence starts
      # against a running JVM or stopped revision mutation on all three OSes.
      # A root panel hands a Crafty-owned server to an unprivileged
      # supervisor account; every path a start writes must then be its own.
      - if: runner.os == 'Linux'
        # The supervisor account reads the checkout, as it reads an install;
        # the runner's home is private by default.
        run: |
          chmod o+x "$HOME"
          sudo env "PATH=$PATH" node .github/ownership-handover.mjs
      # Rendering passes only on a named GL/Vulkan device, never a stub.
      - run: node .github/client-evidence.mjs
      - run: node .github/revision-guard.mjs
      - run: node .github/publication-guard.mjs
      # Solver metadata and the public installer contract run offline with
      # real jars/files. Catalog and CDN responses are controlled fixtures.
      - run: node .github/solver-test.mjs
      - run: node .github/solver-install.mjs
      # Standalone server recipes for every loader: release-only version
      # lists, exact builds, Java majors and refusal of unchecksummed or
      # altered downloads, against controlled upstream metadata.
      - run: node .github/recipe-test.mjs

  # the repo is public — every push gets a full-history secret scan
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
